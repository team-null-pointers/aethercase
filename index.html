<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50/50 text-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherCase | Clinical EHR & Triage</title>
  <link rel="icon" href="https://team-null-pointers.github.io/aethercase/resources/brand/aethercase/aethercase-icon.png" type="image/x-icon">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'floating': '0 10px 40px -10px rgba(0, 0, 0, 0.08)',
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    #body-map-container {
      position: relative;
      width: 220px;
      height: 380px;
      margin: 0 auto;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200"><path fill="%23f8fafc" stroke="%23cbd5e1" stroke-width="1.5" d="M50 10 C40 10, 40 25, 50 25 C60 25, 60 10, 50 10 Z M35 30 L65 30 C75 30, 80 40, 80 50 L80 90 C80 100, 75 100, 70 100 L70 50 L65 50 L65 110 C65 120, 55 120, 55 110 L55 90 L45 90 L45 110 C45 120, 35 120, 35 110 L35 50 L30 50 L30 100 C25 100, 20 100, 20 90 L20 50 C20 40, 25 30, 35 30 Z M45 110 L45 190 C45 195, 35 195, 35 190 L35 115 L50 115 Z M55 110 L55 190 C55 195, 65 195, 65 190 L65 115 Z"/></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: crosshair;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      background-color: white;
      transition: all 0.2s ease;
    }
    #body-map-container:hover { border-color: #93c5fd; background-color: #f8fafc; }
    
    .pain-pin {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #ef4444;
      border: 2px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
      animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
      pointer-events: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    }

    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .barcode-line {
      display: inline-block;
      height: 28px;
      background-color: #0f172a;
      margin-right: 1.5px;
    }

    #cloud-status-toast { transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    input, select, textarea { transition: all 0.2s ease-in-out; }

    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      @page { margin: 10mm; size: A4 portrait; }
      html, body, main, #content-container { height: auto !important; min-height: auto !important; overflow: visible !important; display: block !important; position: static !important; }
      aside, header, #export-btn, .no-print, #cloud-status-toast, #auth-guard-overlay { display: none !important; }
      main { margin: 0 !important; padding: 0 !important; width: 100% !important; }
      .print-document { padding: 0 !important; margin: 0 !important; border-radius: 0 !important; border: none !important; box-shadow: none !important; }
      .print-box, .print-document { page-break-inside: avoid !important; break-inside: avoid !important; }
      #body-map-container { page-break-inside: avoid !important; break-inside: avoid !important; }
      .pain-pin { animation: none !important; } 
      textarea#case-prescription-pad { resize: none !important; border: none !important; background: transparent !important; }
      .print-flatten { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 16px !important; }
      .print-flatten > div { margin-bottom: 0 !important; }
    }
  </style>
</head>
<body class="h-full flex overflow-hidden font-sans antialiased text-sm text-slate-800">

  <!-- Authentication Loading Guard Overlay -->
  <div id="auth-guard-overlay" class="fixed inset-0 bg-white/80 backdrop-blur-md z-[100] flex flex-col items-center justify-center gap-5">
    <div class="w-14 h-14 border-4 border-sky-100 border-t-brand-600 rounded-full animate-spin"></div>
    <div class="text-center">
      <h3 class="font-bold text-slate-900 text-lg tracking-tight">AetherCase Gateway</h3>
      <p class="text-sm text-slate-500 mt-1">Authenticating clinical credentials...</p>
    </div>
  </div>

  <!-- Sidebar Navigation -->
  <aside class="w-64 bg-white border-r border-slate-200/70 flex flex-col justify-between shrink-0 no-print z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
    <div>
      <div class="h-16 flex items-center px-6 border-b border-slate-100 gap-3">
        <div class="w-9 h-9 bg-gradient-to-br from-brand-500 to-brand-700 rounded-xl flex items-center justify-center text-white shadow-sm">
          <i data-lucide="activity" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-xl tracking-tight text-slate-900">Aether<span class="text-brand-600">Case</span></h1>
        </div>
      </div>

      <nav class="p-4 space-y-1.5">
        <button onclick="window.appRouter('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all font-medium">
          <i data-lucide="layout-dashboard" class="w-4.5 h-4.5 text-brand-500"></i>
          <span>Triage Dashboard</span>
        </button>
        <button onclick="window.appRouter('intake')" id="nav-intake" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all font-medium">
          <i data-lucide="stethoscope" class="w-4.5 h-4.5 text-emerald-500"></i>
          <span>New Intake Wizard</span>
        </button>
        <button onclick="window.appRouter('patients')" id="nav-patients" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all font-medium">
          <i data-lucide="users" class="w-4.5 h-4.5 text-indigo-500"></i>
          <span>Patient Directory</span>
        </button>
      </nav>
    </div>

    <!-- Authenticated Practitioner Card -->
    <div class="p-4 m-4 border border-slate-200/70 rounded-2xl bg-slate-50/50 shadow-soft">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <div id="doctor-avatar" class="w-10 h-10 rounded-full bg-brand-100 border-2 border-white flex items-center justify-center text-sm font-bold text-brand-700 shadow-sm shrink-0 overflow-hidden">
            AC
          </div>
          <div class="truncate">
            <p id="doctor-name" class="text-sm font-bold text-slate-900 truncate">Clinician</p>
            <p id="doctor-email" class="text-[11px] text-slate-500 truncate">Syncing profile...</p>
          </div>
        </div>
        <div class="flex flex-col items-end gap-1">
          <button id="btn-edit-profile" title="Edit Doctor Profile" class="p-1.5 rounded-lg hover:bg-white hover:shadow-sm text-slate-400 hover:text-brand-600 transition-all">
            <i data-lucide="user-cog" class="w-4 h-4"></i>
          </button>
          <button id="btn-sign-out" title="Sign Out Securely" class="p-1.5 rounded-lg hover:bg-rose-50 hover:shadow-sm text-slate-400 hover:text-rose-600 transition-all">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Work Area -->
  <main class="flex-1 flex flex-col overflow-hidden bg-slate-50/30">
    <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200/70 px-8 flex items-center justify-between shrink-0 no-print sticky top-0 z-10">
      <div class="flex items-center gap-4">
        <h2 id="view-title" class="text-lg font-bold text-slate-800 tracking-tight">Clinical Triage</h2>
      </div>
    </header>

    <div id="content-container" class="flex-1 overflow-y-auto p-6 md:p-8 relative"></div>
  </main>

  <!-- Patient Chart Modal -->
  <div id="patient-modal" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity">
    <div class="bg-white border border-slate-200/60 w-full max-w-4xl max-h-[90vh] rounded-3xl flex flex-col overflow-hidden shadow-floating">
      <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-white">
        <div>
          <h3 id="modal-patient-name" class="font-bold text-slate-900 text-lg tracking-tight">Electronic Health Record</h3>
          <p id="modal-patient-meta" class="text-xs text-slate-500 mt-0.5">MRN: --- | Age: --</p>
        </div>
        <div class="flex items-center gap-3">
          <button id="modal-view-full-btn" class="px-4 py-2 text-xs bg-white hover:bg-slate-50 text-brand-600 font-semibold rounded-xl border border-slate-200 transition-all flex items-center gap-2 hover:shadow-sm active:scale-95">
            <i data-lucide="external-link" class="w-4 h-4"></i> Full Case
          </button>
          <button onclick="window.closeModal()" class="p-2 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-400 hover:text-slate-700 transition-all active:scale-95">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
      <div id="modal-body" class="p-6 overflow-y-auto space-y-6 text-sm leading-relaxed text-slate-700 bg-slate-50/30"></div>
    </div>
  </div>

  <!-- Edit Patient Details Modal -->
  <div id="edit-patient-modal" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200/60 w-full max-w-lg rounded-3xl flex flex-col overflow-hidden shadow-floating">
      <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center">
        <h3 class="font-bold text-slate-900 text-lg tracking-tight flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-brand-50 flex items-center justify-center"><i data-lucide="edit" class="w-4 h-4 text-brand-600"></i></div> 
          Update Details
        </h3>
        <button onclick="window.closeEditModal()" class="p-2 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-400 transition-all active:scale-95">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <form id="edit-patient-form" onsubmit="window.handleEditSubmit(event)" class="p-6 space-y-5 bg-slate-50/30">
        <input type="hidden" id="edit-pt-id">
        
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Patient Name</label>
          <input type="text" id="edit-pt-name" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-slate-900 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 transition-all shadow-sm">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Chief Complaint / Status</label>
          <input type="text" id="edit-pt-complaint" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-slate-900 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 transition-all shadow-sm">
        </div>

        <div class="grid grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Assigned Bed</label>
            <input type="text" id="edit-pt-bed" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-slate-900 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 transition-all shadow-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Heart Rate (bpm)</label>
            <input type="number" id="edit-pt-hr" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-slate-900 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 transition-all shadow-sm">
          </div>
        </div>

        <div class="pt-5 flex justify-end gap-3 border-t border-slate-100">
          <button type="button" onclick="window.closeEditModal()" class="px-5 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl text-sm font-semibold transition-all active:scale-95 shadow-sm">Cancel</button>
          <button type="submit" id="btn-save-edit" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold transition-all active:scale-95 shadow-soft">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Real-Time Sync Status Toast -->
  <div id="cloud-status-toast" class="fixed bottom-6 right-6 z-40 bg-slate-900/95 backdrop-blur border border-slate-700 text-white px-5 py-3 rounded-2xl shadow-floating flex items-center gap-3 text-sm font-medium opacity-0 pointer-events-none transform translate-y-4">
    <div class="w-6 h-6 rounded-full bg-emerald-500/20 flex items-center justify-center">
      <i data-lucide="cloud-check" class="w-4 h-4 text-emerald-400"></i>
    </div>
    <span id="cloud-status-text">Synchronized with Cloud Firestore</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      deleteDoc, 
      updateDoc, 
      collection, 
      onSnapshot,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCoy14GHFrdob7FqiEqyWhzUDedDLN02-g",
      authDomain: "aethercase-8a28b.firebaseapp.com",
      projectId: "aethercase-8a28b",
      storageBucket: "aethercase-8a28b.firebasestorage.app",
      messagingSenderId: "379115272258",
      appId: "1:379115272258:web:d37b946d752670ff2595db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const APP_ID = 'aethercase-v1';
    const LOGIN_PAGE_URL = "https://team-null-pointers.github.io/aethercase/account/login";

    let currentUser = null;
    let userProfile = null;
    let livePatients = [];
    let unsubscribePatientsSnapshot = null;
    let currentView = 'dashboard';
    let currentRouteParams = {};

    function showCloudSyncToast(msg = "Synchronized with Cloud Firestore") {
      const toast = document.getElementById('cloud-status-toast');
      const text = document.getElementById('cloud-status-text');
      if (!toast) return;
      text.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      }, 2500);
    }

    onAuthStateChanged(auth, async (user) => {
      const overlay = document.getElementById('auth-guard-overlay');
      if (!user) {
        const returnUrl = encodeURIComponent(window.location.href);
        window.location.href = `${LOGIN_PAGE_URL}?redirectUrl=${returnUrl}`;
        return;
      }
      currentUser = user;
      try {
        const userDocRef = doc(db, 'artifacts', APP_ID, 'users', user.uid);
        const userSnap = await getDoc(userDocRef);
        if (userSnap.exists()) {
          userProfile = userSnap.data();
          if (!userProfile.onboardingComplete) {
            window.location.href = `${LOGIN_PAGE_URL}?flow=onboarding`;
            return;
          }
        } else {
          userProfile = { name: user.displayName || 'Dr. Vikram Sharma', email: user.email, gender: 'N/A', country: 'IN' };
        }
        updatePractitionerCard(user, userProfile);
        setupLiveFirestoreSync(user.uid);
        if (overlay) {
          overlay.style.transition = 'opacity 0.3s ease';
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 300);
        }
      } catch (err) {
        console.error("Error loading clinician profile:", err);
        if (overlay) overlay.remove();
      }
    });

    function updatePractitionerCard(user, profile) {
      document.getElementById('doctor-name').textContent = profile?.name || user.displayName || 'Authorized Clinician';
      document.getElementById('doctor-email').textContent = user.email || 'practitioner@aethercase.com';
      const avatarEl = document.getElementById('doctor-avatar');
      if (user.photoURL) {
        avatarEl.innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover">`;
      }
    }

    document.getElementById('btn-sign-out').addEventListener('click', async () => {
      if (confirm("Sign out of AetherCase secure clinical portal?")) {
        if (unsubscribePatientsSnapshot) unsubscribePatientsSnapshot();
        await signOut(auth);
        window.location.href = LOGIN_PAGE_URL;
      }
    });

    document.getElementById('btn-edit-profile').addEventListener('click', () => {
      window.location.href = `${LOGIN_PAGE_URL}?flow=editprofile&redirectUrl=${encodeURIComponent(window.location.href)}`;
    });

    function setupLiveFirestoreSync(uid) {
      const patientsCol = collection(db, 'artifacts', APP_ID, 'users', uid, 'patients');
      unsubscribePatientsSnapshot = onSnapshot(patientsCol, async (snapshot) => {
        const items = [];
        snapshot.forEach((docSnap) => {
          items.push({ id: docSnap.id, ...docSnap.data() });
        });
        items.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
        livePatients = items;
        renderCurrentView();
        showCloudSyncToast("Cloud records synchronized");
      });
    }

    window.openEditModal = function(id) {
      const pt = livePatients.find(p => p.id === id);
      if (!pt) return;
      document.getElementById('edit-pt-id').value = pt.id;
      document.getElementById('edit-pt-name').value = pt.name || '';
      document.getElementById('edit-pt-complaint').value = pt.chiefComplaint || '';
      document.getElementById('edit-pt-bed').value = pt.bedAssigned || '';
      document.getElementById('edit-pt-hr').value = pt.vitals?.hr || '';
      document.getElementById('edit-patient-modal').classList.remove('hidden');
      lucide.createIcons();
    };

    window.closeEditModal = function() {
      document.getElementById('edit-patient-modal').classList.add('hidden');
    };

    window.handleEditSubmit = async function(e) {
      e.preventDefault();
      if (!currentUser) return;
      const btn = document.getElementById('btn-save-edit');
      btn.disabled = true;
      btn.textContent = "Saving...";
      const id = document.getElementById('edit-pt-id').value;
      const patientRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'patients', id);
      try {
        await updateDoc(patientRef, {
          name: document.getElementById('edit-pt-name').value,
          chiefComplaint: document.getElementById('edit-pt-complaint').value,
          bedAssigned: document.getElementById('edit-pt-bed').value,
          "vitals.hr": parseInt(document.getElementById('edit-pt-hr').value) || 0,
          updatedAt: serverTimestamp()
        });
        showCloudSyncToast("Patient details successfully updated");
        window.closeEditModal();
      } catch (error) {
        alert("Failed to update patient: " + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Save Changes";
      }
    };

    window.appRouter = function(view, params = {}) {
      currentView = view;
      currentRouteParams = params;
      renderCurrentView();
    };

    function renderCurrentView() {
      const container = document.getElementById('content-container');
      const title = document.getElementById('view-title');
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-brand-50', 'text-brand-700');
        btn.classList.add('text-slate-600');
      });
      const activeBtn = document.getElementById(`nav-${currentView}`);
      if (activeBtn) activeBtn.classList.add('bg-brand-50', 'text-brand-700');

      if (currentView === 'dashboard') {
        title.innerText = "Clinical Triage & Operational Monitoring";
        renderDashboard(container);
      } else if (currentView === 'intake') {
        title.innerText = "Guided Case-Taking & Real-Time Decision Support";
        renderIntakeWizard(container);
      } else if (currentView === 'patients') {
        title.innerText = "Patient Medical Registry & Encounter Logs";
        renderPatientsView(container);
      } else if (currentView === 'case-record') {
        title.innerText = "Official Electronic Health Record & Case Export";
        renderCaseRecord(container, currentRouteParams.id);
      }
      lucide.createIcons();
    }

    function calculateMEWS(v) {
      let score = 0;
      if (v.sbp <= 70) score += 3;
      else if (v.sbp <= 80) score += 2;
      else if (v.sbp <= 100) score += 1;
      else if (v.sbp >= 200) score += 2;

      if (v.hr < 40) score += 2;
      else if (v.hr <= 50) score += 1;
      else if (v.hr >= 101 && v.hr <= 110) score += 1;
      else if (v.hr >= 111 && v.hr <= 129) score += 2;
      else if (v.hr >= 130) score += 3;

      if (v.rr < 9) score += 2;
      else if (v.rr >= 21 && v.rr <= 29) score += 2;
      else if (v.rr >= 30) score += 3;

      if (v.temp < 95.0) score += 2;
      else if (v.temp >= 101.3) score += 2;

      return score;
    }

    function runClinicalCDSInference(data) {
      const text = `${data.complaint || ''} ${data.hpi || ''} ${data.ros || ''} ${data.exam || ''}`.toLowerCase();
      const vitals = data.vitals;
      const mews = calculateMEWS(vitals);

      const redFlags = [];
      const differential = [];
      let esiLevel = 3;
      let orders = [];
      let primaryIcd = "R69 - Illness, unspecified";

      const shockIndex = (vitals.sbp > 0) ? (vitals.hr / vitals.sbp).toFixed(2) : 0;
      if (shockIndex >= 1.0) redFlags.push(`Critical Shock Index (${shockIndex}) - High Risk of Hypoperfusion`);
      else if (shockIndex >= 0.8) redFlags.push(`Elevated Shock Index (${shockIndex})`);

      if (vitals.spo2 < 90) redFlags.push(`Severe Hypoxemia (SpO2 ${vitals.spo2}%)`);
      else if (vitals.spo2 < 94) redFlags.push(`Moderate Hypoxemia (SpO2 ${vitals.spo2}%)`);

      if (vitals.sbp < 90) redFlags.push(`Hemodynamic Instability / Hypotension (${vitals.sbp}/${vitals.dbp} mmHg)`);
      if (vitals.hr > 120) redFlags.push(`Marked Tachycardia (${vitals.hr} bpm)`);
      else if (vitals.hr < 50) redFlags.push(`Sinus Bradycardia (${vitals.hr} bpm)`);
      if (vitals.rr >= 28) redFlags.push(`Severe Tachypnea (${vitals.rr}/min)`);
      if (vitals.temp >= 101.3) redFlags.push(`Pyrexia (${vitals.temp}°F)`);

      const isCardio = text.includes('chest pain') || text.includes('pressure') || text.includes('substernal') || text.includes('jaw') || text.includes('arm radiation') || text.includes('angina');
      const isStroke = text.includes('weakness') || text.includes('facial droop') || text.includes('slurred speech') || text.includes('numbness') || text.includes('thunderclap');
      const isAnaphylaxis = (text.includes('stridor') || text.includes('peanut') || text.includes('hives') || text.includes('swelling')) && (text.includes('breath') || text.includes('wheez'));
      const isSepsis = (vitals.temp >= 100.4 || vitals.temp <= 96.8) && (vitals.hr > 90) && (vitals.rr > 20);
      const isAppendicitis = text.includes('right lower quadrant') || text.includes('rlq') || text.includes('mcburney') || text.includes('periumbilical');

      if (isCardio) {
        redFlags.push("Acute Coronary Syndrome High Suspicion");
        primaryIcd = "I21.0 - Acute Transmural Myocardial Infarction";
        differential.push({ condition: "ST-Elevation Myocardial Infarction / NSTEMI", probability: vitals.sbp < 100 ? 88 : 76, icd: "I21.0" });
        differential.push({ condition: "Acute Pericarditis / Myocarditis", probability: 14, icd: "I30.9" });
        differential.push({ condition: "Thoracic Aortic Dissection", probability: 8, icd: "I71.01" });
        orders.push("STAT 12-Lead Electrocardiogram (ECG)", "Serial High-Sensitivity Troponin I", "Portable Chest X-Ray", "Dual Large-Bore IVs");
        esiLevel = vitals.sbp < 90 || vitals.spo2 < 92 ? 1 : 2;
      } else if (isStroke) {
        redFlags.push("Acute Neurological Deficit - Stroke Code Window");
        primaryIcd = "I63.9 - Cerebral Infarction, Unspecified";
        differential.push({ condition: "Acute Ischemic Cerebrovascular Accident (CVA)", probability: 82, icd: "I63.9" });
        differential.push({ condition: "Intracranial Hemorrhage", probability: 14, icd: "I61.9" });
        differential.push({ condition: "Transient Ischemic Attack (TIA)", probability: 4, icd: "G45.9" });
        orders.push("Non-Contrast Head CT STAT", "NIHSS Assessment", "Point-of-Care Blood Glucose", "CTA Head and Neck");
        esiLevel = 1;
      } else if (isAnaphylaxis) {
        redFlags.push("Laryngeal Edema / Airway Obstruction Risk");
        primaryIcd = "T78.2XXA - Anaphylactic Shock, Unspecified";
        differential.push({ condition: "Severe Anaphylaxis with Airway Compromise", probability: 92, icd: "T78.2XXA" });
        differential.push({ condition: "Severe Acute Bronchospasm", probability: 8, icd: "J98.01" });
        orders.push("0.3mg Epinephrine IM (1:1000) STAT", "High-Flow Oxygen via NRB", "IV Methylprednisolone 125mg", "Continuous Pulse Oximetry");
        esiLevel = 1;
      } else if (isSepsis) {
        redFlags.push("SIRS Criteria Positive - Sepsis Protocol Indicated");
        primaryIcd = "A41.9 - Sepsis, Unspecified Organism";
        differential.push({ condition: "Severe Sepsis / Early Septic Shock", probability: 78, icd: "A41.9" });
        differential.push({ condition: "Community Acquired Pneumonia / Pyelonephritis", probability: 22, icd: "J18.9" });
        orders.push("Serum Lactate STAT", "Blood Cultures x2 prior to antibiotics", "Broad-Spectrum IV Antibiotics", "30mL/kg IV Crystalloid Bolus");
        esiLevel = 2;
      } else if (isAppendicitis) {
        redFlags.push("Localized Peritoneal Irritation in RLQ");
        primaryIcd = "K35.80 - Acute Appendicitis, Unspecified";
        differential.push({ condition: "Acute Appendicitis", probability: 84, icd: "K35.80" });
        differential.push({ condition: "Mesenteric Lymphadenitis", probability: 10, icd: "I88.0" });
        differential.push({ condition: "Ovarian Torsion / Ruptured Cyst", probability: 6, icd: "N83.20" });
        orders.push("CT Abdomen & Pelvis with IV Contrast", "Complete Blood Count (CBC) with differential", "Urine Pregnancy Test (if applicable)", "NPO Order");
        esiLevel = 3;
      } else {
        differential.push({ condition: "Undifferentiated Clinical Presentation", probability: 55, icd: "R69" });
        differential.push({ condition: "Viral Syndrome / Dehydration", probability: 25, icd: "B34.9" });
        differential.push({ condition: "Musculoskeletal Pain", probability: 20, icd: "M79.1" });
        orders.push("Complete Blood Count (CBC)", "Basic Metabolic Panel (BMP)", "Clinical Observation");
        esiLevel = mews >= 3 ? 2 : 4;
      }

      if (mews >= 5 && esiLevel > 1) {
        esiLevel = 1;
        redFlags.push(`Critical MEWS (${mews}) - Requires Immediate Resuscitation Bed`);
      }

      const urgencyLabel = esiLevel === 1 ? "Immediate / Resuscitation" : esiLevel === 2 ? "Emergent (<15 min)" : esiLevel === 3 ? "Urgent (<60 min)" : "Semi-Urgent";
      
      const soap = `S (Subjective): ${data.age}yo ${data.gender} presents with chief complaint of "${data.complaint || 'unspecified'}". Onset: ${data.onset || 'N/A'}. Duration: ${data.duration || 'N/A'} days. PMHx: ${data.pmhx || 'None reported'}. Allergies: ${data.allergies || 'NKDA'}. ROS: ${data.ros || 'Reviewed'}.\nO (Objective): Vitals: BP ${vitals.sbp}/${vitals.dbp} mmHg, HR ${vitals.hr} bpm, RR ${vitals.rr}/min, SpO2 ${vitals.spo2}%, Temp ${vitals.temp}°F. Calculated MEWS: ${mews}. Physical Exam: ${data.exam || 'No acute distress noted.'} Pain points identified on body map: ${data.painMarkers ? data.painMarkers.length : 0}.\nA (Assessment): Triage ESI Level ${esiLevel} (${urgencyLabel}). ICD-10: ${primaryIcd}. Differential: ${differential[0]?.condition || 'Under evaluation'}.\nP (Plan): Recommended diagnostic workup: ${orders.join('; ')}. Re-evaluate physiological vitals q15m.`;

      return {
        esiLevel,
        mewsScore: mews,
        urgency: urgencyLabel,
        primaryIcd10: primaryIcd,
        differential,
        redFlags: [...new Set(redFlags)],
        recommendedOrders: orders,
        soapNote: soap
      };
    }

    window.changeWizardStep = function(dir) {
      const stepDiv = document.getElementById(`wizard-step-${currentStep}`);
      if (dir > 0) {
        const requiredFields = stepDiv.querySelectorAll('input[required], select[required], textarea[required]');
        for (let el of requiredFields) {
          if (!el.reportValidity()) return;
        }
      }

      document.getElementById(`wizard-step-${currentStep}`).classList.add('hidden');
      const prevInd = document.getElementById(`step-indicator-${currentStep}`);
      prevInd.classList.remove('bg-brand-600', 'text-white', 'ring-4', 'ring-brand-100');
      prevInd.classList.add('bg-white', 'border-2', 'border-brand-600', 'text-brand-600');

      currentStep += dir;

      document.getElementById(`wizard-step-${currentStep}`).classList.remove('hidden');
      const currInd = document.getElementById(`step-indicator-${currentStep}`);
      currInd.classList.remove('bg-white', 'border-2', 'border-brand-600', 'text-brand-600', 'border-slate-200', 'text-slate-400');
      currInd.classList.add('bg-brand-600', 'text-white', 'ring-4', 'ring-brand-100');

      document.getElementById('btn-prev').classList.toggle('invisible', currentStep === 1);
      if (currentStep === 4) {
        document.getElementById('btn-next').classList.add('hidden');
        document.getElementById('btn-submit').classList.remove('hidden');
      } else {
        document.getElementById('btn-next').classList.remove('hidden');
        document.getElementById('btn-submit').classList.add('hidden');
      }

      setTimeout(() => {
        const firstInput = document.getElementById(`wizard-step-${currentStep}`).querySelector('input, select, textarea');
        if (firstInput) firstInput.focus();
      }, 50);

      triggerAsyncAI();
      lucide.createIcons();
    };

    function attachWizardErgonomics() {
      const form = document.getElementById('wizard-form');
      form.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const target = e.target;
          if (target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON') return;
          e.preventDefault();
          const stepDiv = document.getElementById(`wizard-step-${currentStep}`);
          const interactables = Array.from(stepDiv.querySelectorAll('input:not([type="hidden"]), select'));
          const idx = interactables.indexOf(target);
          if (idx > -1 && idx + 1 < interactables.length) {
            interactables[idx + 1].focus();
          } else {
            if (currentStep < 4) window.changeWizardStep(1);
          }
        }
      });

      const monitoredIds = ['pt-complaint', 'pt-hpi', 'pt-ros', 'pt-exam', 'vital-hr', 'vital-sbp', 'vital-dbp', 'vital-rr', 'vital-spo2', 'vital-temp', 'pt-age', 'pt-gender'];
      monitoredIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', triggerAsyncAI);
      });
    }

    window.calculateBMIAndVitals = function() {
      const h = parseFloat(document.getElementById('pt-height')?.value) || 0;
      const w = parseFloat(document.getElementById('pt-weight')?.value) || 0;
      const hr = parseFloat(document.getElementById('vital-hr')?.value) || 0;
      const temp = parseFloat(document.getElementById('vital-temp')?.value) || 0;
      const sbp = parseFloat(document.getElementById('vital-sbp')?.value) || 0;
      const badgesContainer = document.getElementById('vitals-alert-badges');

      if (!badgesContainer) return;
      let badgesHTML = '';

      if (h >= 30 && h <= 300 && w > 0) {
        const hm = h / 100;
        const bmi = (w / (hm * hm)).toFixed(1);
        let status = 'Normal';
        let color = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        if (bmi < 18.5) { status = 'Underweight'; color = 'bg-amber-50 text-amber-700 border-amber-200'; }
        else if (bmi >= 25.0 && bmi < 30.0) { status = 'Overweight'; color = 'bg-amber-50 text-amber-700 border-amber-200'; }
        else if (bmi >= 30.0) { status = 'Obese'; color = 'bg-rose-50 text-rose-700 border-rose-200'; }
        badgesHTML += `<span class="px-2.5 py-1 rounded-lg text-[10px] font-bold border ${color}">BMI: ${bmi} (${status})</span>`;
      }

      if (temp >= 100.4) badgesHTML += `<span class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-rose-50 text-rose-700 border border-rose-200">Pyrexia</span>`;
      if (hr > 100) badgesHTML += `<span class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-rose-50 text-rose-700 border border-rose-200">Tachycardia</span>`;
      else if (hr > 0 && hr < 60) badgesHTML += `<span class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-brand-50 text-brand-700 border border-brand-200">Bradycardia</span>`;
      if (sbp > 0 && sbp < 90) badgesHTML += `<span class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-rose-50 text-rose-700 border border-rose-200">Hypotension</span>`;

      badgesContainer.innerHTML = badgesHTML;
      triggerAsyncAI();
    };

      wizardPainMarkers.push({

      triggerAsyncAI();
    };

          esiEl.innerText = `Level ${analysis.esiLevel} (${analysis.urgency})`;
          esiEl.className = `text-xl font-black mt-1 ${analysis.esiLevel === 1 ? 'text-rose-600 animate-pulse' : analysis.esiLevel === 2 ? 'text-amber-600' : 'text-brand-600'}`;

        }

        const rfEl = document.getElementById('live-redflags');
        if (rfEl) {
          rfEl.innerHTML = analysis.redFlags.length === 0 ? `<div class="text-slate-400 text-xs italic font-medium">No physiological alarms detected yet.</div>` :
            analysis.redFlags.map(rf => `
              <div class="flex items-center gap-2 p-2.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-semibold">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-rose-500"></i>
                <span>${rf}</span>
              </div>

        }

        const diffEl = document.getElementById('live-diff');
        if (diffEl) {
          diffEl.innerHTML = analysis.differential.map(d => `

        const ordersEl = document.getElementById('live-orders');

          badge.innerText = "Evaluation Ready";
        }
        lucide.createIcons();
      }, 400);
    }

    window.simulateVoiceDictation = function() {
      const hpiEl = document.getElementById('pt-hpi');
      if (!hpiEl) return;
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech-to-text is not supported in this browser.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false; 
      recognition.interimResults = false;

      const dictateBtn = document.querySelector('button[onclick="window.simulateVoiceDictation()"]');
      const originalHtml = dictateBtn ? dictateBtn.innerHTML : '';

      recognition.onstart = () => { if (dictateBtn) { dictateBtn.innerHTML = '<i data-lucide="mic" class="w-3.5 h-3.5 text-rose-500 animate-pulse"></i> Listening...'; lucide.createIcons(); } };
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        hpiEl.value = hpiEl.value.trim() ? `${hpiEl.value.trim()} ${transcript}` : transcript;
        hpiEl.dispatchEvent(new Event('input'));
      };
      recognition.onerror = (event) => alert("Microphone error: " + event.error);
      recognition.onend = () => { if (dictateBtn) { dictateBtn.innerHTML = originalHtml; lucide.createIcons(); } };
      recognition.start();
    };

            <div class="bg-white border border-slate-200/60 rounded-xl p-5 shadow-sm">
              <h5 class="font-bold text-[11px] uppercase tracking-widest text-slate-500 mb-4 flex items-center justify-between">
                Vital Trends (Last 4 Hrs) <i data-lucide="trending-up" class="w-4 h-4 text-slate-400"></i>
              </h5>
              <div class="relative h-32 w-full"><canvas id="vitalsChart"></canvas></div>
            </div>
          </div>

          <div class="space-y-6">
            <div class="bg-white border border-slate-200/60 rounded-xl p-5 shadow-sm">
              <h5 class="text-brand-600 font-bold uppercase tracking-widest text-[11px] mb-4">Differential Diagnoses</h5>
              <div class="space-y-4">
                ${(patient.analysis?.differential || []).map(d => `
                  <div>
                    <div class="flex justify-between text-sm mb-1.5">
                      <span class="text-slate-800 font-semibold">${d.condition} <span class="text-[10px] font-mono text-slate-400">(${d.icd || 'ICD-10'})</span></span>
                      <span class="text-brand-600 font-mono font-bold">${d.probability}%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                      <div class="bg-brand-500 h-2 rounded-full" style="width: ${d.probability}%"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            ${patient.analysis?.redFlags?.length > 0 ? `
            <div>
              <h5 class="text-rose-600 font-bold uppercase tracking-widest text-[11px] mb-2">Active Red Flags</h5>
              <div class="space-y-2">
                ${patient.analysis.redFlags.map(rf => `
                  <div class="px-4 py-2.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-sm font-semibold flex items-center gap-3 shadow-sm">
                    <i data-lucide="alert-octagon" class="w-4 h-4 text-rose-500"></i> ${rf}
                  </div>
                `).join('')}
              </div>
            </div>` : ''}
          </div>
        </div>

        <div>
          <h5 class="text-slate-500 font-bold uppercase tracking-widest text-[11px] mb-2 flex items-center justify-between">
            <span>Automated SBAR / SOAP Note</span>
            <button onclick="window.copyFullSoapNote('${patient.id}')" class="text-brand-600 hover:underline flex items-center gap-1.5 font-semibold">
              <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Note
            </button>
          </h5>
          <pre class="bg-slate-900 border border-slate-700 p-5 rounded-2xl text-slate-300 text-xs font-mono leading-relaxed whitespace-pre-wrap overflow-x-auto shadow-inner">${patient.analysis?.soapNote || 'No SOAP note available.'}</pre>
        </div>
      `;

      document.getElementById('patient-modal').classList.remove('hidden');
      lucide.createIcons();

      setTimeout(() => {
        const canvas = document.getElementById('vitalsChart');
        if (canvas) {
          const hr = patient.vitals?.hr || 75;
          new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: {
              labels: ['-3h', '-2h', '-1h', 'Current'],
              datasets: [{
                label: 'Heart Rate',
                data: [hr > 100 ? hr - 15 : hr + 5, hr > 100 ? hr - 5 : hr - 2, hr > 100 ? hr - 8 : hr + 3, hr],
                borderColor: '#0284c7', backgroundColor: 'rgba(2, 132, 199, 0.1)', borderWidth: 3, tension: 0.4, fill: true, pointBackgroundColor: '#0284c7', pointRadius: 4
              }]
            },
            options: {
              responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
              scales: { x: { grid: { display: false } }, y: { grid: { color: '#f1f5f9' } } }
            }
          });
        }
      }, 150);
    };

    window.closeModal = function() {
      document.getElementById('patient-modal').classList.add('hidden');
    };

    window.addEventListener('DOMContentLoaded', () => window.appRouter('dashboard'));
  </script>
</body>
</html>
