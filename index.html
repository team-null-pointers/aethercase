    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Interactive 2D Body Map */
    #body-map-container {
      position: relative;
      width: 220px;
      height: 380px;
      margin: 0 auto;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200"><path fill="%23f1f5f9" stroke="%2394a3b8" stroke-width="2" d="M50 10 C40 10, 40 25, 50 25 C60 25, 60 10, 50 10 Z M35 30 L65 30 C75 30, 80 40, 80 50 L80 90 C80 100, 75 100, 70 100 L70 50 L65 50 L65 110 C65 120, 55 120, 55 110 L55 90 L45 90 L45 110 C45 120, 35 120, 35 110 L35 50 L30 50 L30 100 C25 100, 20 100, 20 90 L20 50 C20 40, 25 30, 35 30 Z M45 110 L45 190 C45 195, 35 195, 35 190 L35 115 L50 115 Z M55 110 L55 190 C55 195, 65 195, 65 190 L65 115 Z"/></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: crosshair;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background-color: white;
    }
    .pain-pin {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #ef4444;
      border: 2px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
      animation: pulse 1.5s infinite;
      pointer-events: none;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Skeleton Loader for AI NLP Inference */
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Barcode generator styling */
    .barcode-line {
      display: inline-block;
      height: 28px;
      background-color: #0f172a;
      margin-right: 1.5px;
    }

    /* Sync Indicator Toast */
    #cloud-status-toast {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* ==========================================================================
       PREMIUM EXPORT FORMAT (PRESERVES APP UI FOR PDF)
       ========================================================================== */
    @media print {
      * { 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important; 
      }
      
      @page {
        margin: 10mm;
        size: A4 portrait;
      }
      
      html, body, main, #content-container {
        height: auto !important;
        min-height: auto !important;
        overflow: visible !important;
        display: block !important;
        position: static !important;
      }
      
      aside, header, #export-btn, .no-print, #cloud-status-toast, #auth-guard-overlay { 
        display: none !important; 
      }
      
      main { 
        margin: 0 !important; 
        padding: 0 !important; 
        width: 100% !important;
      }

      .print-document {
        padding: 0 !important;
        margin: 0 !important;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
      }

      .print-box, .print-document { 
        page-break-inside: avoid !important; 
        break-inside: avoid !important; 
      }

      #body-map-container {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      
      .pain-pin { animation: none !important; } 
      
      textarea#case-prescription-pad {
        resize: none !important;
      }
      
      .print-flatten { 
        display: grid !important; 
        grid-template-columns: 1fr 1fr !important; 
        gap: 16px !important;
      }
      .print-flatten > div { 
        margin-bottom: 0 !important; 
      }
    }
  </style>

    // ============================================================================
    // CLINICAL INFERENCE & CDS HEURISTICS
    // ============================================================================
    function calculateMEWS(v) {
      let score = 0;
      if (v.sbp <= 70) score += 3;
      else if (v.sbp <= 80) score += 2;
      else if (v.sbp <= 100) score += 1;
      else if (v.sbp >= 200) score += 2;

      if (v.hr < 40) score += 2;
      else if (v.hr <= 50) score += 1;
      else if (v.hr >= 101 && v.hr <= 110) score += 1;
      else if (v.hr >= 111 && v.hr <= 129) score += 2;
      else if (v.hr >= 130) score += 3;

      if (v.rr < 9) score += 2;
      else if (v.rr >= 21 && v.rr <= 29) score += 2;
      else if (v.rr >= 30) score += 3;

      if (v.temp < 35.0) score += 2;
      else if (v.temp >= 38.5) score += 2;

      return score;
    }

    function runClinicalCDSInference(data) {
      const text = `${data.complaint || ''} ${data.hpi || ''} ${data.ros || ''} ${data.exam || ''}`.toLowerCase();
      const vitals = data.vitals;
      const mews = calculateMEWS(vitals);

      const redFlags = [];
      const differential = [];
      let esiLevel = 3;
      let orders = [];
      let primaryIcd = "R69 - Illness, unspecified";

      const shockIndex = (vitals.sbp > 0) ? (vitals.hr / vitals.sbp).toFixed(2) : 0;
      if (shockIndex >= 1.0) redFlags.push(`Critical Shock Index (${shockIndex}) - High Risk of Hypoperfusion`);
      else if (shockIndex >= 0.8) redFlags.push(`Elevated Shock Index (${shockIndex})`);

      if (vitals.spo2 < 90) redFlags.push(`Severe Hypoxemia (SpO2 ${vitals.spo2}%)`);
      else if (vitals.spo2 < 94) redFlags.push(`Moderate Hypoxemia (SpO2 ${vitals.spo2}%)`);

      if (vitals.sbp < 90) redFlags.push(`Hemodynamic Instability / Hypotension (${vitals.sbp}/${vitals.dbp} mmHg)`);
      if (vitals.hr > 120) redFlags.push(`Marked Tachycardia (${vitals.hr} bpm)`);
      else if (vitals.hr < 50) redFlags.push(`Sinus Bradycardia (${vitals.hr} bpm)`);
      if (vitals.rr >= 28) redFlags.push(`Severe Tachypnea (${vitals.rr}/min)`);
      if (vitals.temp >= 38.5) redFlags.push(`Pyrexia (${vitals.temp}°C)`);

      const isCardio = text.includes('chest pain') || text.includes('pressure') || text.includes('substernal') || text.includes('jaw') || text.includes('arm radiation') || text.includes('angina');
      const isStroke = text.includes('weakness') || text.includes('facial droop') || text.includes('slurred speech') || text.includes('numbness') || text.includes('thunderclap');
      const isAnaphylaxis = (text.includes('stridor') || text.includes('peanut') || text.includes('hives') || text.includes('swelling')) && (text.includes('breath') || text.includes('wheez'));
      const isSepsis = (vitals.temp >= 38.0 || vitals.temp <= 36.0) && (vitals.hr > 90) && (vitals.rr > 20);
      const isAppendicitis = text.includes('right lower quadrant') || text.includes('rlq') || text.includes('mcburney') || text.includes('periumbilical');

      if (isCardio) {
        redFlags.push("Acute Coronary Syndrome High Suspicion");
        primaryIcd = "I21.0 - Acute Transmural Myocardial Infarction";
        differential.push({ condition: "ST-Elevation Myocardial Infarction / NSTEMI", probability: vitals.sbp < 100 ? 88 : 76, icd: "I21.0" });
        differential.push({ condition: "Acute Pericarditis / Myocarditis", probability: 14, icd: "I30.9" });
        differential.push({ condition: "Thoracic Aortic Dissection", probability: 8, icd: "I71.01" });
        orders.push("STAT 12-Lead Electrocardiogram (ECG)", "Serial High-Sensitivity Troponin I", "Portable Chest X-Ray", "Dual Large-Bore IVs");
        esiLevel = vitals.sbp < 90 || vitals.spo2 < 92 ? 1 : 2;
      } else if (isStroke) {
        redFlags.push("Acute Neurological Deficit - Stroke Code Window");
        primaryIcd = "I63.9 - Cerebral Infarction, Unspecified";
        differential.push({ condition: "Acute Ischemic Cerebrovascular Accident (CVA)", probability: 82, icd: "I63.9" });
        differential.push({ condition: "Intracranial Hemorrhage", probability: 14, icd: "I61.9" });
        differential.push({ condition: "Transient Ischemic Attack (TIA)", probability: 4, icd: "G45.9" });
        orders.push("Non-Contrast Head CT STAT", "NIHSS Assessment", "Point-of-Care Blood Glucose", "CTA Head and Neck");
        esiLevel = 1;
      } else if (isAnaphylaxis) {
        redFlags.push("Laryngeal Edema / Airway Obstruction Risk");
        primaryIcd = "T78.2XXA - Anaphylactic Shock, Unspecified";
        differential.push({ condition: "Severe Anaphylaxis with Airway Compromise", probability: 92, icd: "T78.2XXA" });
        differential.push({ condition: "Severe Acute Bronchospasm", probability: 8, icd: "J98.01" });
        orders.push("0.3mg Epinephrine IM (1:1000) STAT", "High-Flow Oxygen via NRB", "IV Methylprednisolone 125mg", "Continuous Pulse Oximetry");
        esiLevel = 1;
      } else if (isSepsis) {
        redFlags.push("SIRS Criteria Positive - Sepsis Protocol Indicated");
        primaryIcd = "A41.9 - Sepsis, Unspecified Organism";
        differential.push({ condition: "Severe Sepsis / Early Septic Shock", probability: 78, icd: "A41.9" });
        differential.push({ condition: "Community Acquired Pneumonia / Pyelonephritis", probability: 22, icd: "J18.9" });
        orders.push("Serum Lactate STAT", "Blood Cultures x2 prior to antibiotics", "Broad-Spectrum IV Antibiotics", "30mL/kg IV Crystalloid Bolus");
        esiLevel = 2;
      } else if (isAppendicitis) {
        redFlags.push("Localized Peritoneal Irritation in RLQ");
        primaryIcd = "K35.80 - Acute Appendicitis, Unspecified";
        differential.push({ condition: "Acute Appendicitis", probability: 84, icd: "K35.80" });
        differential.push({ condition: "Mesenteric Lymphadenitis", probability: 10, icd: "I88.0" });
        differential.push({ condition: "Ovarian Torsion / Ruptured Cyst", probability: 6, icd: "N83.20" });
        orders.push("CT Abdomen & Pelvis with IV Contrast", "Complete Blood Count (CBC) with differential", "Urine Pregnancy Test (if applicable)", "NPO Order");
        esiLevel = 3;
      } else {
        differential.push({ condition: "Undifferentiated Clinical Presentation", probability: 55, icd: "R69" });
        differential.push({ condition: "Viral Syndrome / Dehydration", probability: 25, icd: "B34.9" });
        differential.push({ condition: "Musculoskeletal Pain", probability: 20, icd: "M79.1" });
        orders.push("Complete Blood Count (CBC)", "Basic Metabolic Panel (BMP)", "Clinical Observation");
        esiLevel = mews >= 3 ? 2 : 4;
      }

      if (mews >= 5 && esiLevel > 1) {
        esiLevel = 1;
        redFlags.push(`Critical MEWS (${mews}) - Requires Immediate Resuscitation Bed`);
      }

      const urgencyLabel = esiLevel === 1 ? "Immediate / Resuscitation" : esiLevel === 2 ? "Emergent (<15 min)" : esiLevel === 3 ? "Urgent (<60 min)" : "Semi-Urgent";
      
      const soap = `S (Subjective): ${data.age}yo ${data.gender} presents with chief complaint of "${data.complaint || 'unspecified'}". Onset: ${data.onset || 'N/A'}. Duration: ${data.duration || 'N/A'} days. PMHx: ${data.pmhx || 'None reported'}. Allergies: ${data.allergies || 'NKDA'}. ROS: ${data.ros || 'Reviewed'}.\nO (Objective): Vitals: BP ${vitals.sbp}/${vitals.dbp} mmHg, HR ${vitals.hr} bpm, RR ${vitals.rr}/min, SpO2 ${vitals.spo2}%, Temp ${vitals.temp}°C. Calculated MEWS: ${mews}. Physical Exam: ${data.exam || 'No acute distress noted.'} Pain points identified on body map: ${data.painMarkers ? data.painMarkers.length : 0}.\nA (Assessment): Triage ESI Level ${esiLevel} (${urgencyLabel}). ICD-10: ${primaryIcd}. Differential: ${differential[0]?.condition || 'Under evaluation'}.\nP (Plan): Recommended diagnostic workup: ${orders.join('; ')}. Re-evaluate physiological vitals q15m.`;

      return {
        esiLevel,
        mewsScore: mews,
        urgency: urgencyLabel,
        primaryIcd10: primaryIcd,
        differential,
        redFlags: [...new Set(redFlags)],
        recommendedOrders: orders,
        soapNote: soap
      };
    }

    window.changeWizardStep = function(dir) {
      const stepDiv = document.getElementById(`wizard-step-${currentStep}`);
      if (dir > 0) {
        const requiredFields = stepDiv.querySelectorAll('input[required], select[required], textarea[required]');
        for (let el of requiredFields) {
          if (!el.reportValidity()) return;
        }
      }

      document.getElementById(`wizard-step-${currentStep}`).classList.add('hidden');
      document.getElementById(`step-indicator-${currentStep}`).classList.remove('bg-sky-600', 'text-white');
      document.getElementById(`step-indicator-${currentStep}`).classList.add('bg-slate-100', 'text-slate-500');

      currentStep += dir;

      document.getElementById(`wizard-step-${currentStep}`).classList.remove('hidden');
      document.getElementById(`step-indicator-${currentStep}`).classList.remove('bg-slate-100', 'text-slate-500');
      document.getElementById(`step-indicator-${currentStep}`).classList.add('bg-sky-600', 'text-white');

      document.getElementById('btn-prev').classList.toggle('invisible', currentStep === 1);
      if (currentStep === 4) {
        document.getElementById('btn-next').classList.add('hidden');
        document.getElementById('btn-submit').classList.remove('hidden');
      } else {
        document.getElementById('btn-next').classList.remove('hidden');
        document.getElementById('btn-submit').classList.add('hidden');
      }

      setTimeout(() => {
        const firstInput = document.getElementById(`wizard-step-${currentStep}`).querySelector('input, select, textarea');
        if (firstInput) firstInput.focus();
      }, 50);

      triggerAsyncAI();
      lucide.createIcons();
    };

    function attachWizardErgonomics() {
      const form = document.getElementById('wizard-form');
      form.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const target = e.target;
          if (target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON') return;
          e.preventDefault();

          const stepDiv = document.getElementById(`wizard-step-${currentStep}`);
          const interactables = Array.from(stepDiv.querySelectorAll('input:not([type="hidden"]), select'));
          const idx = interactables.indexOf(target);
          if (idx > -1 && idx + 1 < interactables.length) {
            interactables[idx + 1].focus();
          } else {
            if (currentStep < 4) window.changeWizardStep(1);
          }
        }
      });

      const monitoredIds = ['pt-complaint', 'pt-hpi', 'pt-ros', 'pt-exam', 'vital-hr', 'vital-sbp', 'vital-dbp', 'vital-rr', 'vital-spo2', 'vital-temp', 'pt-age', 'pt-gender'];
      monitoredIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', triggerAsyncAI);
      });
    }

    window.calculateBMIAndVitals = function() {
      const h = parseFloat(document.getElementById('pt-height')?.value) || 0;
      const w = parseFloat(document.getElementById('pt-weight')?.value) || 0;
      const hr = parseFloat(document.getElementById('vital-hr')?.value) || 0;
      const temp = parseFloat(document.getElementById('vital-temp')?.value) || 0;
      const sbp = parseFloat(document.getElementById('vital-sbp')?.value) || 0;
      const badgesContainer = document.getElementById('vitals-alert-badges');

      if (!badgesContainer) return;
      let badgesHTML = '';

      if (h >= 30 && h <= 300 && w > 0) {
        const hm = h / 100;
        const bmi = (w / (hm * hm)).toFixed(1);
        let status = 'Normal';
        let color = 'bg-emerald-100 text-emerald-700 border-emerald-200';
        if (bmi < 18.5) { status = 'Underweight'; color = 'bg-amber-100 text-amber-700 border-amber-200'; }
        else if (bmi >= 25.0 && bmi < 30.0) { status = 'Overweight'; color = 'bg-amber-100 text-amber-700 border-amber-200'; }
        else if (bmi >= 30.0) { status = 'Obese'; color = 'bg-rose-100 text-rose-700 border-rose-200'; }
        badgesHTML += `<span class="px-2 py-0.5 rounded text-[10px] font-bold border ${color}">BMI: ${bmi} (${status})</span>`;
      }

      if (temp >= 38.0) badgesHTML += `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-700 border border-rose-200">Pyrexia</span>`;
      if (hr > 100) badgesHTML += `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-700 border border-rose-200">Tachycardia</span>`;
      else if (hr > 0 && hr < 60) badgesHTML += `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-sky-100 text-sky-700 border border-sky-200">Bradycardia</span>`;
      if (sbp > 0 && sbp < 90) badgesHTML += `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-700 border border-rose-200">Hypotension</span>`;

      badgesContainer.innerHTML = badgesHTML;
      triggerAsyncAI();
    };

    window.handleBodyMapClick = function(e) {
      const container = document.getElementById('body-map-container');
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const pin = document.createElement('div');
      pin.className = 'pain-pin';
      pin.style.left = `${x}px`;
      pin.style.top = `${y}px`;

      container.appendChild(pin);
      wizardPainMarkers.push({
        x: (x / rect.width).toFixed(3),
        y: (y / rect.height).toFixed(3)
      });
      triggerAsyncAI();
    };

    window.clearPainPins = function() {
      const container = document.getElementById('body-map-container');
      if (container) {
        container.querySelectorAll('.pain-pin').forEach(p => p.remove());
      }
      wizardPainMarkers = [];
      triggerAsyncAI();
    };

        painMarkers: wizardPainMarkers,

    async function triggerAsyncAI() {
      clearTimeout(aiTimeout);
      const badge = document.getElementById('ai-status-badge');
      if (badge) {
        badge.className = "px-2 py-0.5 text-[10px] rounded bg-indigo-100 text-indigo-700 font-semibold border border-indigo-200 animate-pulse";
        badge.innerText = "Analyzing NLP...";
      }

      aiTimeout = setTimeout(async () => {
        const data = readFormData();
        const analysis = runClinicalCDSInference(data);

        const esiEl = document.getElementById('live-esi');
        if (esiEl) {
          esiEl.innerText = `Level ${analysis.esiLevel} (${analysis.urgency})`;
          esiEl.className = `text-xl font-bold mt-1 ${analysis.esiLevel === 1 ? 'text-rose-600 animate-pulse' : analysis.esiLevel === 2 ? 'text-amber-600' : 'text-sky-600'}`;
        }

        const mewsEl = document.getElementById('live-mews');
        if (mewsEl) {
          const risk = analysis.mewsScore >= 4 ? "(Critical)" : analysis.mewsScore >= 2 ? "(Moderate)" : "(Low Risk)";
          mewsEl.innerHTML = `${analysis.mewsScore} <span class="text-xs font-normal text-slate-500">${risk}</span>`;
          mewsEl.className = `text-xl font-bold mt-1 ${analysis.mewsScore >= 4 ? 'text-rose-600' : analysis.mewsScore >= 2 ? 'text-amber-600' : 'text-emerald-600'}`;
        }

        const rfEl = document.getElementById('live-redflags');
        if (rfEl) {
          rfEl.innerHTML = analysis.redFlags.length === 0 ? `<div class="text-slate-400 text-xs italic">No physiological alarms detected yet.</div>` :
            analysis.redFlags.map(rf => `
              <div class="flex items-center gap-2 p-2 bg-rose-100 border border-rose-200 text-rose-700 rounded text-xs">
                <i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0 text-rose-600"></i>
                <span>${rf}</span>
              </div>
            `).join('');
        }

        const diffEl = document.getElementById('live-diff');
        if (diffEl) {
          diffEl.innerHTML = analysis.differential.map(d => `
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-slate-700 font-medium">${d.condition} <span class="text-[10px] font-mono text-slate-400">(${d.icd || 'ICD-10'})</span></span>
                <span class="text-sky-600 font-mono font-bold">${d.probability}%</span>
              </div>
              <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                <div class="bg-sky-500 h-1.5 rounded-full" style="width: ${d.probability}%"></div>
              </div>
            </div>
          `).join('');
        }

        const ordersEl = document.getElementById('live-orders');
        if (ordersEl) {
          ordersEl.innerHTML = analysis.recommendedOrders.map(o => `<li>${o}</li>`).join('');
        }

        if (badge) {
          badge.className = "px-2 py-0.5 text-[10px] rounded bg-emerald-100 text-emerald-700 font-semibold border border-emerald-200";
          badge.innerText = "Live Evaluation";
        }
        lucide.createIcons();
      }, 400);
    }

            <div class="print-box rounded-xl p-4 mb-6 bg-slate-50 border border-slate-300">
              <div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-800 flex items-center gap-1.5">
                  <i data-lucide="activity" class="w-4 h-4 text-emerald-600"></i> Hemodynamic Profile & Physiological Baseline
                </h3>
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 text-[10px] font-bold rounded ${pt.analysis?.esiLevel === 1 ? 'bg-rose-100 text-rose-800 border-rose-300' : 'bg-amber-100 text-amber-800 border-amber-300'} border">
                    ESI Level ${pt.analysis?.esiLevel || 3} (${pt.analysis?.urgency || 'Urgent'})
                  </span>
                  <span class="text-[11px] font-mono text-slate-600 font-bold">MEWS: ${pt.analysis?.mewsScore || 0}</span>
                </div>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2.5 text-center text-xs">
                <div class="bg-white p-2 rounded border border-slate-200">
                  <span class="text-[9px] text-slate-400 uppercase block">Blood Pressure</span>
                  <strong class="font-mono text-slate-900">${sbp}/${dbp}</strong> <span class="text-[10px] text-slate-500">mmHg</span>
                </div>
                <div class="bg-white p-2 rounded border border-slate-200">
                  <span class="text-[9px] text-slate-400 uppercase block">Heart Rate</span>
                  <strong class="font-mono ${hr > 100 ? 'text-rose-600 font-bold' : 'text-slate-900'}">${hr}</strong> <span class="text-[10px] text-slate-500">bpm</span>
                </div>
                <div class="bg-white p-2 rounded border border-slate-200">
                  <span class="text-[9px] text-slate-400 uppercase block">Mean Art. Press. (MAP)</span>
                  <strong class="font-mono ${map < 65 ? 'text-rose-600 font-bold' : 'text-slate-900'}">${map}</strong> <span class="text-[10px] text-slate-500">mmHg</span>
                </div>
                <div class="bg-white p-2 rounded border border-slate-200">
                  <span class="text-[9px] text-slate-400 uppercase block">Shock Index</span>
                  <strong class="font-mono ${shockIndex >= 1.0 ? 'text-rose-600 font-bold' : 'text-slate-900'}">${shockIndex}</strong>
                </div>
                <div class="bg-white p-2 rounded border border-slate-200">
                  <span class="text-[9px] text-slate-400 uppercase block">SpO2 (Pulse Ox)</span>
                  <strong class="font-mono ${(pt.vitals?.spo2 || 98) < 94 ? 'text-rose-600 font-bold' : 'text-slate-900'}">${pt.vitals?.spo2 || 98}%</strong> <span class="text-[10px] text-slate-500">RA</span>
                </div>
                <div class="bg-white p-2 rounded border border-slate-200">
                  <span class="text-[9px] text-slate-400 uppercase block">Resp. Rate</span>
                  <strong class="font-mono text-slate-900">${pt.vitals?.rr || 16}</strong> <span class="text-[10px] text-slate-500">/min</span>
                </div>
                <div class="bg-white p-2 rounded border border-slate-200">
                  <span class="text-[9px] text-slate-400 uppercase block">Temperature</span>
                  <strong class="font-mono text-slate-900">${pt.vitals?.temp || 37.0}</strong> <span class="text-[10px] text-slate-500">°C</span>
                </div>
              </div>

              ${pt.analysis?.redFlags?.length > 0 ? `
              <div class="mt-3 p-2.5 bg-rose-50 border border-rose-200 rounded-lg flex items-start gap-2">
                <i data-lucide="shield-alert" class="w-4 h-4 text-rose-600 shrink-0 mt-0.5"></i>
                <div>
                  <span class="text-[10px] font-bold text-rose-800 uppercase tracking-wider block">Identified Clinical Red Flags</span>
                  <p class="text-xs text-rose-700 mt-0.5 font-medium">${pt.analysis.redFlags.join(' • ')}</p>
                </div>
              </div>` : ''}
            </div>

            <!-- History and Physical Exam -->
            <div class="print-flatten grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <div class="space-y-4 text-xs">
                <div class="print-box border border-slate-300 p-4 rounded-xl">
                  <h4 class="font-bold text-slate-800 uppercase tracking-wider text-[11px] border-b border-slate-200 pb-1.5 mb-2.5 flex items-center gap-1.5">
                    <i data-lucide="clipboard" class="w-3.5 h-3.5 text-sky-600"></i> Chief Complaint & HPI
                  </h4>
                  <p class="text-slate-900 font-semibold mb-1"><span class="text-slate-400 uppercase text-[10px]">Presenting Complaint:</span> ${pt.chiefComplaint}</p>
                  <p class="text-slate-600 leading-relaxed bg-slate-50 p-2.5 rounded border border-slate-200 whitespace-pre-wrap">${pt.hpi || 'None documented.'}</p>
                  <div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-slate-100 text-slate-500">
                    <div><strong>Onset:</strong> ${pt.onset || 'N/A'}</div>
                    <div><strong>Duration:</strong> ${pt.duration ? pt.duration + ' Days' : 'N/A'}</div>
                  </div>
                </div>

                <div class="print-box border border-slate-300 p-4 rounded-xl">
                  <h4 class="font-bold text-slate-800 uppercase tracking-wider text-[11px] border-b border-slate-200 pb-1.5 mb-2.5 flex items-center gap-1.5">
                    <i data-lucide="shield" class="w-3.5 h-3.5 text-rose-600"></i> Allergies & Chronic Conditions
                  </h4>
                  <div class="p-2 bg-rose-50 border border-rose-200 rounded text-rose-800 font-bold mb-2">
                    <span class="text-[9px] uppercase tracking-wider block text-rose-500">Documented Drug Allergies</span>
                    ${pt.allergies || 'NKDA (No Known Drug Allergies)'}
                  </div>
                  <div class="space-y-1 text-slate-700">
                    <p><strong>Past Medical History:</strong> ${pt.pmhx || 'None'}</p>
                    <p><strong>Family & Social History:</strong> ${pt.fhx || 'Non-contributory'}</p>
                    <p><strong>Current Medications:</strong> ${pt.medications || 'None'}</p>
                  </div>
                </div>
              </div>

              <div class="space-y-4 text-xs">
                <div class="print-box border border-slate-300 p-4 rounded-xl">
                  <h4 class="font-bold text-slate-800 uppercase tracking-wider text-[11px] border-b border-slate-200 pb-1.5 mb-2.5 flex items-center gap-1.5">
                    <i data-lucide="stethoscope" class="w-3.5 h-3.5 text-sky-600"></i> Systemic Physical Examination
                  </h4>
                  <div class="bg-slate-50 p-2.5 rounded border border-slate-200 text-slate-800 whitespace-pre-wrap leading-relaxed">
                    ${pt.exam || 'No focal physical examination abnormalities recorded.'}
                  </div>

                  <div class="mt-4 pt-3 border-t border-slate-200 text-center">
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block mb-2">Anatomical Symptom Mapping</span>
                    <div id="body-map-container" style="page-break-inside: avoid; break-inside: avoid; display: block; margin: 0 auto; height: 180px; width: 110px;">
                      ${pinsHtml}
                    </div>
                    <p class="text-[9px] text-slate-400 mt-1">Localized Markers: ${pt.painMarkers ? pt.painMarkers.length : 0}</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Provisional Diagnosis & ICD-10 -->
            <div class="print-box rounded-xl p-4 mb-6 bg-white border-2 border-sky-600 shadow-sm">
              <div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-900 flex items-center gap-1.5">
                  <i data-lucide="brain-circuit" class="w-4 h-4 text-sky-600"></i> Clinical Impression & ICD-10 Classification
                </h3>
                <span class="text-xs font-mono font-bold text-sky-800 bg-sky-50 px-2 py-0.5 rounded border border-sky-200">
                  Primary ICD: ${pt.analysis?.primaryIcd10 || pt.analysis?.differential?.[0]?.icd || 'I21.0'}
                </span>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                ${(pt.analysis?.differential || []).map(d => `
                  <div class="p-2.5 bg-slate-50 rounded-lg border border-slate-200 text-xs">
                    <div class="flex justify-between font-bold text-slate-800">
                      <span>${d.condition}</span>
                      <span class="text-sky-700">${d.probability}%</span>
                    </div>
                    <span class="text-[10px] font-mono text-slate-500 block mt-0.5">Code: ${d.icd || 'ICD-10-CM'}</span>
                  </div>
                `).join('')}
              </div>

              <div class="mt-3 pt-3 border-t border-slate-200">
                <span class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Recommended Diagnostic Workup</span>
                <ul class="list-disc list-inside text-xs text-slate-700 space-y-0.5">
                  ${(pt.analysis?.recommendedOrders || []).map(o => `<li>${o}</li>`).join('')}
                </ul>
              </div>
            </div>

            <!-- Prescription Grid -->
            <div class="print-box rounded-xl p-5 mb-6 bg-white border border-slate-400 shadow-sm">
              <div class="flex items-center justify-between border-b-2 border-slate-800 pb-3 mb-4">
                <div class="flex items-center gap-3">
                  <span class="text-4xl font-serif font-black text-slate-900 leading-none">℞</span>
                  <div>
                    <h3 class="text-sm font-bold uppercase tracking-widest text-slate-900">Physician Medication Order & Discharge Rx</h3>
                    <p class="text-[10px] text-slate-500">Generic substitution permitted unless specifically indicated otherwise</p>
                  </div>
                </div>
                <div class="text-right text-xs">
                  <span class="text-[10px] text-slate-400 uppercase block">Prescription Date</span>
                  <strong class="font-mono text-slate-800">${new Date(pt.timestamp).toLocaleDateString()}</strong>
                </div>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs whitespace-nowrap mb-4">
                  <thead class="bg-slate-100 text-slate-600 border-b border-slate-300 font-semibold text-[10px] uppercase">
                    <tr>
                      <th class="py-2 px-3 border-r border-slate-200">#</th>
                      <th class="py-2 px-3 border-r border-slate-200">Generic & Formulation</th>
                      <th class="py-2 px-3 border-r border-slate-200">Route</th>
                      <th class="py-2 px-3 border-r border-slate-200">Frequency / Sig</th>
                      <th class="py-2 px-3 border-r border-slate-200">Duration</th>
                      <th class="py-2 px-3">Instructions / Dietary Relation</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rxRows}
                  </tbody>
                </table>
              </div>

              <div class="mt-4 pt-3 border-t border-slate-200">
                <label class="text-[10px] font-bold uppercase text-slate-500 block mb-1">Additional Clinical Orders & Instructions</label>
                <textarea id="case-prescription-pad" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded p-3 text-slate-800 font-mono text-xs focus:outline-none focus:border-sky-500 transition resize-none" oninput="window.updatePrescriptionInFirestore('${pt.id}', this.value)">${pt.prescription || ''}</textarea>
              </div>
            </div>

            <!-- Follow-up Instructions -->
            <div class="print-box rounded-xl p-4 mb-6 bg-slate-50 border border-slate-200 text-xs">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <h4 class="font-bold text-slate-800 uppercase tracking-wider text-[11px] mb-1 flex items-center gap-1.5 text-rose-700">
                    <i data-lucide="alert-octagon" class="w-3.5 h-3.5"></i> When to Return to ER Immediately
                  </h4>
                  <ul class="list-disc list-inside text-slate-600 space-y-0.5">
                    <li>Recurrence of acute retrosternal chest tightness or radiating pain</li>
                    <li>Sudden shortness of breath, dizziness, or syncopal episode</li>
                    <li>Hypotension with cold diaphoresis or persistent vomiting</li>
                  </ul>
                </div>
                <div>
                  <h4 class="font-bold text-slate-800 uppercase tracking-wider text-[11px] mb-1 flex items-center gap-1.5 text-sky-800">
                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i> Review & Follow-up Consultation
                  </h4>
                  <p class="text-slate-600">Review in Cardiology OPD within <strong>48 to 72 hours</strong> with repeat 12-lead ECG.</p>
                  <p class="text-slate-500 mt-1 font-semibold">Dietary Order: Low sodium (&lt;2g/day), diabetic-friendly cardiac diet.</p>
                </div>
              </div>
            </div>

            <!-- Digital Authentication Signature -->
            <div class="border-t-2 border-slate-900 pt-6 mt-6 text-xs" style="margin-bottom: 80px;">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                <div>
                  <span class="text-[9px] uppercase font-bold text-slate-400 block mb-1">Digital Audit Trail</span>
                  <p class="font-mono text-[10px] text-slate-600">SHA-256: 7f8a9e22b...3c11d0</p>
                  <p class="text-[10px] text-emerald-700 font-semibold mt-0.5 flex items-center gap-1">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Verified Cloud EHR Record
                  </p>
                  <p class="text-[9px] text-slate-400 mt-1">Generated: ${new Date().toLocaleString()}</p>
                </div>

                <div class="text-center"></div>

                <div class="text-right">
                  <div class="border-b-2 border-slate-900 w-48 ml-auto mb-2"></div>
                  <strong class="text-slate-900 text-sm block">${userProfile?.name || pt.attendingPhysician || 'Dr. Vikram Sharma, MD'}</strong>
                  <span class="text-[11px] text-slate-600 block">Director - Interventional Cardiology</span>
                  <span class="font-mono text-[10px] text-slate-500 block">Delhi Medical Council Reg: 45982</span>
                  <span class="text-[9px] text-slate-400 italic block mt-1">Authorized Electronic Sign-off</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    window.updatePrescriptionInFirestore = async function(id, val) {
      if (!currentUser) return;
      try {
        const docRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'patients', id);
        await updateDoc(docRef, { prescription: val, updatedAt: serverTimestamp() });
        showCloudSyncToast("Prescription updated in Firestore");
      } catch (err) {
        console.error("Failed to update prescription:", err);
      }
    };

    window.copyFullSoapNote = function(patientId) {
      const pt = livePatients.find(p => p.id === patientId);
      if (!pt) return;
      navigator.clipboard.writeText(pt.analysis?.soapNote || '').then(() => {
        alert("Full clinical SOAP Note copied to clipboard!");
      });
    };

    // ============================================================================
    // MODAL QUICK VIEW (WITH VITAL TRENDS CHARTING)
    // ============================================================================
    window.openModal = function(patientId) {
      const patient = livePatients.find(p => p.id === patientId);
      if (!patient) return;

      document.getElementById('modal-patient-name').innerText = `${patient.name} (${patient.gender}, ${patient.age}y)`;
      document.getElementById('modal-patient-meta').innerText = `UHID: ${patient.uhid || patient.id} • Registered: ${new Date(patient.timestamp).toLocaleTimeString()}`;
      
      const fullBtn = document.getElementById('modal-view-full-btn');
      fullBtn.onclick = () => {
        window.closeModal();
        window.appRouter('case-record', { id: patient.id });
      };

      const modalBody = document.getElementById('modal-body');
      modalBody.innerHTML = `
        <div class="flex flex-wrap items-center justify-between p-4 bg-slate-50 border border-slate-200 rounded-xl gap-4">
          <div class="flex items-center gap-3">
            <span class="px-3 py-1 rounded text-xs font-bold ${
              patient.analysis?.esiLevel === 1 ? 'bg-rose-100 text-rose-700 border border-rose-200' :
              patient.analysis?.esiLevel === 2 ? 'bg-amber-100 text-amber-700 border border-amber-200' :
              'bg-sky-100 text-sky-700 border border-sky-200'
            }">
              ESI ${patient.analysis?.esiLevel || 3} • ${patient.analysis?.urgency || 'Urgent'}
            </span>
            <span class="text-xs text-slate-500">MEWS Score: <strong class="text-slate-900">${patient.analysis?.mewsScore || 0}</strong></span>
          </div>
          <div class="flex items-center gap-4 text-xs font-mono">
            <span>HR: <strong class="text-slate-900">${patient.vitals?.hr}</strong></span>
            <span>BP: <strong class="text-slate-900">${patient.vitals?.sbp}/${patient.vitals?.dbp}</strong></span>
            <span>SpO2: <strong class="text-slate-900">${patient.vitals?.spo2}%</strong></span>
            <span>RR: <strong class="text-slate-900">${patient.vitals?.rr}</strong></span>
            <span>Temp: <strong class="text-slate-900">${patient.vitals?.temp}°C</strong></span>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-4">
            <div>
              <h5 class="text-slate-500 font-semibold uppercase tracking-wide text-[11px] mb-1">Chief Complaint</h5>
              <p class="text-slate-900 bg-slate-50 p-3 rounded-lg border border-slate-200">${patient.chiefComplaint}</p>
            </div>
            
            <div class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm">
              <h5 class="font-semibold text-[10px] uppercase text-slate-500 mb-2 flex items-center justify-between">
                Vital Trends (Last 4 Hrs) <i data-lucide="trending-up" class="w-3.5 h-3.5 text-slate-400"></i>
              </h5>
              <div class="relative h-24 w-full">
                <canvas id="vitalsChart"></canvas>
              </div>
            </div>
            
            <div class="grid grid-cols-2 gap-2 text-[11px]">
              <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-lg">
                <span class="text-slate-500 block">Allergies</span>
                <span class="text-rose-600 font-medium">${patient.allergies}</span>
              </div>
              <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-lg">
                <span class="text-slate-500 block">Blood Group</span>
                <span class="text-slate-900 font-bold">${patient.bloodGroup || 'Unknown'}</span>
              </div>
            </div>
          </div>

          <div class="space-y-4">
            <div>
              <h5 class="text-sky-600 font-semibold uppercase tracking-wide text-[11px] mb-1">Likely Differential Diagnoses (ICD-10)</h5>
              <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2.5">
                ${(patient.analysis?.differential || []).map(d => `
                  <div>
                    <div class="flex justify-between text-xs mb-1">
                      <span class="text-slate-700 font-medium">${d.condition} <span class="text-[10px] font-mono text-slate-400">(${d.icd || 'ICD-10'})</span></span>
                      <span class="text-sky-600 font-mono font-bold">${d.probability}%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
                      <div class="bg-sky-500 h-1.5 rounded-full" style="width: ${d.probability}%"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div>
              <h5 class="text-rose-600 font-semibold uppercase tracking-wide text-[11px] mb-1">Active Red Flags</h5>
              <div class="space-y-1">
                ${(patient.analysis?.redFlags || []).map(rf => `
                  <div class="px-3 py-1.5 bg-rose-50 border border-rose-200 text-rose-700 rounded text-xs flex items-center gap-2">
                    <i data-lucide="alert-octagon" class="w-3.5 h-3.5 text-rose-600"></i>
                    ${rf}
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>

        <div>
          <h5 class="text-slate-500 font-semibold uppercase tracking-wide text-[11px] mb-1 flex items-center justify-between">
            <span>Automated SBAR / SOAP Note</span>
            <button onclick="window.copyFullSoapNote('${patient.id}')" class="text-sky-600 hover:underline flex items-center gap-1">
              <i data-lucide="copy" class="w-3 h-3"></i> Copy Note
            </button>
          </h5>
          <pre class="bg-slate-50 border border-slate-200 p-4 rounded-xl text-slate-700 text-xs font-mono leading-relaxed whitespace-pre-wrap overflow-x-auto">${patient.analysis?.soapNote || 'No SOAP note available.'}</pre>
        </div>
      `;

      document.getElementById('patient-modal').classList.remove('hidden');
      lucide.createIcons();

      setTimeout(() => {
        const canvas = document.getElementById('vitalsChart');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          const hr = patient.vitals?.hr || 75;
          new Chart(ctx, {
            type: 'line',
            data: {
              labels: ['-3h', '-2h', '-1h', 'Current'],
              datasets: [{
                label: 'Heart Rate',
                data: [
                  hr > 100 ? hr - 15 : hr + 5, 
                  hr > 100 ? hr - 5 : hr - 2, 
                  hr > 100 ? hr - 8 : hr + 3, 
                  hr
                ],
                borderColor: '#ef4444',
                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                borderWidth: 2,
                tension: 0.4,
                fill: true,
                pointBackgroundColor: '#ef4444',
                pointRadius: 3
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false }, tooltip: { enabled: true } },
              scales: { 
                x: { grid: { display: false }, ticks: { font: { size: 9 } } }, 
                y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 9 } } } 
              }
            }
          });
        }
      }, 150);
    };

    window.closeModal = function() {
      document.getElementById('patient-modal').classList.add('hidden');
    };

    // Initial boot
    window.addEventListener('DOMContentLoaded', () => {
      window.appRouter('dashboard');
    });
  </script>
</body>
</html>
