<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherCase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Added Chart.js for vital sign trending -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef8ff',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom EHR scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Interactive 2D Body Map */
    #body-map-container {
      position: relative;
      width: 220px;
      height: 380px;
      margin: 0 auto;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200"><path fill="%23f1f5f9" stroke="%2394a3b8" stroke-width="2" d="M50 10 C40 10, 40 25, 50 25 C60 25, 60 10, 50 10 Z M35 30 L65 30 C75 30, 80 40, 80 50 L80 90 C80 100, 75 100, 70 100 L70 50 L65 50 L65 110 C65 120, 55 120, 55 110 L55 90 L45 90 L45 110 C45 120, 35 120, 35 110 L35 50 L30 50 L30 100 C25 100, 20 100, 20 90 L20 50 C20 40, 25 30, 35 30 Z M45 110 L45 190 C45 195, 35 195, 35 190 L35 115 L50 115 Z M55 110 L55 190 C55 195, 65 195, 65 190 L65 115 Z"/></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: crosshair;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background-color: white;
    }
    .pain-pin {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #ef4444;
      border: 2px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
      animation: pulse 1.5s infinite;
      pointer-events: none;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Skeleton Loader for AI Inference */
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Print Formats */
    @media print {
      * { 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important; 
      }
      
      @page {
        margin: 15mm;
        size: portrait;
      }
      
      html, body, main, #content-container {
        height: auto !important;
        min-height: auto !important;
        overflow: visible !important;
        display: block !important;
        position: static !important;
      }
      
      body { 
        background: white !important; 
        color: black !important; 
        font-size: 10pt !important;
      }
      
      aside, header, #export-btn, .no-print { 
        display: none !important; 
      }
      
      main { 
        margin: 0 !important; 
        padding: 0 !important; 
        width: 100% !important;
      }
      
      .print-flatten { 
        display: block !important; 
        width: 100% !important; 
      }
      .print-flatten > div { 
        display: block !important; 
        width: 100% !important; 
        margin-bottom: 20px !important; 
      }
      
      .print-box { 
        border: 1px solid #cbd5e1 !important; 
        color: black !important; 
        background: white !important; 
        page-break-inside: avoid !important; 
        break-inside: avoid !important; 
        margin-bottom: 20px !important;
        box-shadow: none !important;
      }
      
      #body-map-container {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .pain-pin { animation: none !important; } 
    }
  </style>
</head>

    // Storage access
    function getPatients() {
      const stored = localStorage.getItem(DB_KEY);
      if (!stored) {
        localStorage.setItem(DB_KEY, JSON.stringify(initialDataset));
        return initialDataset;
      }
      return JSON.parse(stored);
    }

    function savePatients(data) {
      localStorage.setItem(DB_KEY, JSON.stringify(data));
    }

    function seedInitialData() {
      localStorage.setItem(DB_KEY, JSON.stringify(initialDataset));
      router(currentView);
    }

    // Navigation state
    let currentView = 'dashboard';
    let currentRouteParams = {};

    function router(view, params = {}) {
      currentView = view;
      currentRouteParams = params;
      const container = document.getElementById('content-container');
      const title = document.getElementById('view-title');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-slate-100', 'text-slate-900');
        btn.classList.add('text-slate-600');
      });
      const activeBtn = document.getElementById(`nav-${view}`);
      if (activeBtn) activeBtn.classList.add('bg-slate-100', 'text-slate-900');

      if (view === 'dashboard') {
        title.innerText = "Clinical Triage & Operational Monitoring";
        renderDashboard(container);
      } else if (view === 'intake') {
        title.innerText = "Guided Case-Taking & Real-Time Decision Support";
        renderIntakeWizard(container);
      } else if (view === 'patients') {
        title.innerText = "Patient Medical Registry & Encounter Logs";
        renderPatientsView(container);
      } else if (view === 'case-record') {
        title.innerText = "Official Electronic Health Record & Case Export";
        renderCaseRecord(container, params.id);
      }
      lucide.createIcons();
    }

    // ============================================================================
    // CLINICAL INFERENCE & CDS HEURISTICS
    // ============================================================================
    function calculateMEWS(v) {
      let score = 0;
      if (v.sbp <= 70) score += 3;
      else if (v.sbp <= 80) score += 2;
      else if (v.sbp <= 100) score += 1;
      else if (v.sbp >= 200) score += 2;

      if (v.hr < 40) score += 2;
      else if (v.hr <= 50) score += 1;
      else if (v.hr >= 101 && v.hr <= 110) score += 1;
      else if (v.hr >= 111 && v.hr <= 129) score += 2;
      else if (v.hr >= 130) score += 3;

      if (v.rr < 9) score += 2;
      else if (v.rr >= 21 && v.rr <= 29) score += 2;
      else if (v.rr >= 30) score += 3;

      if (v.temp < 35.0) score += 2;
      else if (v.temp >= 38.5) score += 2;

      return score;
    }

    function runClinicalCDSInference(data) {
      const text = `${data.complaint || ''} ${data.hpi || ''} ${data.ros || ''} ${data.exam || ''}`.toLowerCase();
      const vitals = data.vitals;
      const mews = calculateMEWS(vitals);

      const redFlags = [];
      const differential = [];
      let esiLevel = 3;
      let orders = [];

      if (vitals.spo2 < 90) redFlags.push(`Severe Hypoxemia (SpO2 ${vitals.spo2}%)`);
      else if (vitals.spo2 < 94) redFlags.push(`Moderate Hypoxemia (SpO2 ${vitals.spo2}%)`);

      if (vitals.sbp < 90) redFlags.push(`Hemodynamic Instability / Hypotension (${vitals.sbp}/${vitals.dbp} mmHg)`);
      if (vitals.hr > 120) redFlags.push(`Marked Tachycardia (${vitals.hr} bpm)`);
      else if (vitals.hr < 50) redFlags.push(`Sinus Bradycardia (${vitals.hr} bpm)`);
      if (vitals.rr >= 28) redFlags.push(`Severe Tachypnea (${vitals.rr}/min)`);
      if (vitals.temp >= 38.5) redFlags.push(`Pyrexia (${vitals.temp}°C)`);

      const isCardio = text.includes('chest pain') || text.includes('pressure') || text.includes('substernal') || text.includes('jaw') || text.includes('arm radiation') || text.includes('angina');
      const isStroke = text.includes('weakness') || text.includes('facial droop') || text.includes('slurred speech') || text.includes('numbness') || text.includes('thunderclap');
      const isAnaphylaxis = (text.includes('stridor') || text.includes('peanut') || text.includes('hives') || text.includes('swelling')) && (text.includes('breath') || text.includes('wheez'));
      const isSepsis = (vitals.temp >= 38.0 || vitals.temp <= 36.0) && (vitals.hr > 90) && (vitals.rr > 20);
      const isAppendicitis = text.includes('right lower quadrant') || text.includes('rlq') || text.includes('mcburney') || text.includes('periumbilical');

      if (isCardio) {
        redFlags.push("Acute Coronary Syndrome High Suspicion");
        differential.push({ condition: "ST-Elevation Myocardial Infarction / NSTEMI", probability: vitals.sbp < 100 ? 88 : 76 });
        differential.push({ condition: "Acute Pericarditis / Myocarditis", probability: 14 });
        differential.push({ condition: "Thoracic Aortic Dissection", probability: 8 });
        orders.push("STAT 12-Lead Electrocardiogram (ECG)", "Serial High-Sensitivity Troponin I", "Portable Chest X-Ray", "Dual Large-Bore IVs");
        esiLevel = vitals.sbp < 90 || vitals.spo2 < 92 ? 1 : 2;
      } else if (isStroke) {
        redFlags.push("Acute Neurological Deficit - Stroke Code Window");
        differential.push({ condition: "Acute Ischemic Cerebrovascular Accident (CVA)", probability: 82 });
        differential.push({ condition: "Intracranial Hemorrhage", probability: 14 });
        differential.push({ condition: "Transient Ischemic Attack (TIA)", probability: 4 });
        orders.push("Non-Contrast Head CT STAT", "NIHSS Assessment", "Point-of-Care Blood Glucose", "CTA Head and Neck");
        esiLevel = 1;
      } else if (isAnaphylaxis) {
        redFlags.push("Laryngeal Edema / Airway Obstruction Risk");
        differential.push({ condition: "Severe Anaphylaxis with Airway Compromise", probability: 92 });
        differential.push({ condition: "Severe Acute Bronchospasm", probability: 8 });
        orders.push("0.3mg Epinephrine IM (1:1000) STAT", "High-Flow Oxygen via NRB", "IV Methylprednisolone 125mg", "Continuous Pulse Oximetry");
        esiLevel = 1;
      } else if (isSepsis) {
        redFlags.push("SIRS Criteria Positive - Sepsis Protocol Indicated");
        differential.push({ condition: "Severe Sepsis / Early Septic Shock", probability: 78 });
        differential.push({ condition: "Pneumonia / Pyelonephritis", probability: 22 });
        orders.push("Serum Lactate STAT", "Blood Cultures x2 prior to antibiotics", "Broad-Spectrum IV Antibiotics", "30mL/kg IV Crystalloid Bolus");
        esiLevel = 2;
      } else if (isAppendicitis) {
        redFlags.push("Localized Peritoneal Irritation in RLQ");
        differential.push({ condition: "Acute Appendicitis", probability: 84 });
        differential.push({ condition: "Mesenteric Lymphadenitis", probability: 10 });
        differential.push({ condition: "Ovarian Torsion / Ruptured Cyst", probability: 6 });
        orders.push("CT Abdomen & Pelvis with IV Contrast", "Complete Blood Count (CBC) with differential", "Urine Pregnancy Test (if applicable)", "NPO Order");
        esiLevel = 3;
      } else {
        differential.push({ condition: "Undifferentiated Clinical Presentation", probability: 55 });
        differential.push({ condition: "Viral Syndrome / Dehydration", probability: 25 });
        differential.push({ condition: "Musculoskeletal Pain", probability: 20 });
        orders.push("Complete Blood Count (CBC)", "Basic Metabolic Panel (BMP)", "Clinical Observation");
        esiLevel = mews >= 3 ? 2 : 4;
      }

      if (mews >= 5 && esiLevel > 1) {
        esiLevel = 1;
        redFlags.push(`Critical MEWS (${mews}) - Requires Immediate Resuscitation Bed`);
      }

      const urgencyLabel = esiLevel === 1 ? "Immediate / Resuscitation" : esiLevel === 2 ? "Emergent (<15 min)" : esiLevel === 3 ? "Urgent (<60 min)" : "Semi-Urgent";
      
      const soap = `S (Subjective): ${data.age}yo ${data.gender} presents with chief complaint of "${data.complaint || 'unspecified'}". Onset: ${data.onset || 'N/A'}. Duration: ${data.duration || 'N/A'} days. PMHx: ${data.pmhx || 'None reported'}. Allergies: ${data.allergies || 'NKDA'}. ROS: ${data.ros || 'Reviewed'}.\nO (Objective): Vitals: BP ${vitals.sbp}/${vitals.dbp} mmHg, HR ${vitals.hr} bpm, RR ${vitals.rr}/min, SpO2 ${vitals.spo2}%, Temp ${vitals.temp}°C. Calculated MEWS: ${mews}. Physical Exam: ${data.exam || 'No acute distress noted.'} Pain points identified on body map: ${data.painMarkers ? data.painMarkers.length : 0}.\nA (Assessment): Triage ESI Level ${esiLevel} (${urgencyLabel}). Clinical Impression: ${differential[0]?.condition || 'Under evaluation'}.\nP (Plan): Recommended diagnostic workup: ${orders.join('; ')}. Re-evaluate physiological vitals q15m.`;

      return {
        esiLevel,
        mewsScore: mews,
        urgency: urgencyLabel,
        differential,
        redFlags: [...new Set(redFlags)],
        recommendedOrders: orders,
        soapNote: soap

    }

    function renderPriorityQueueRows(patients) {

        else if (pt.analysis.esiLevel === 2) badgeColor = "bg-amber-100 text-amber-700 border border-amber-200";

        return `

    function changeStep(dir) {
      const stepDiv = document.getElementById(`wizard-step-${currentStep}`);
      if (dir > 0) {
        const requiredFields = stepDiv.querySelectorAll('input[required], select[required], textarea[required]');
        for (let el of requiredFields) {
          if (!el.reportValidity()) return;
        }
      }

      document.getElementById(`wizard-step-${currentStep}`).classList.add('hidden');
      document.getElementById(`step-indicator-${currentStep}`).classList.remove('bg-sky-600', 'text-white');
      document.getElementById(`step-indicator-${currentStep}`).classList.add('bg-slate-100', 'text-slate-500');

      currentStep += dir;

      document.getElementById(`wizard-step-${currentStep}`).classList.remove('hidden');
      document.getElementById(`step-indicator-${currentStep}`).classList.remove('bg-slate-100', 'text-slate-500');
      document.getElementById(`step-indicator-${currentStep}`).classList.add('bg-sky-600', 'text-white');

      document.getElementById('btn-prev').classList.toggle('invisible', currentStep === 1);
      if (currentStep === 4) {
        document.getElementById('btn-next').classList.add('hidden');
        document.getElementById('btn-submit').classList.remove('hidden');
      } else {
        document.getElementById('btn-next').classList.remove('hidden');
        document.getElementById('btn-submit').classList.add('hidden');
      }

      setTimeout(() => {
        const firstInput = document.getElementById(`wizard-step-${currentStep}`).querySelector('input, select, textarea');
        if (firstInput) firstInput.focus();
      }, 50);

      triggerAsyncAI();
      lucide.createIcons();
    }

    function attachWizardErgonomics() {
      const form = document.getElementById('wizard-form');
      form.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const target = e.target;
          if (target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON') return;
          e.preventDefault();

          const stepDiv = document.getElementById(`wizard-step-${currentStep}`);
          const interactables = Array.from(stepDiv.querySelectorAll('input:not([type="hidden"]), select'));
          const idx = interactables.indexOf(target);
          if (idx > -1 && idx + 1 < interactables.length) {
            interactables[idx + 1].focus();
          } else {
            if (currentStep < 4) changeStep(1);
          }
        }
      });

      const monitoredIds = ['pt-complaint', 'pt-hpi', 'pt-ros', 'pt-exam', 'vital-hr', 'vital-sbp', 'vital-dbp', 'vital-rr', 'vital-spo2', 'vital-temp', 'pt-age', 'pt-gender'];
      monitoredIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', triggerAsyncAI);
      });
    }

    function calculateBMIAndVitals() {
      const h = parseFloat(document.getElementById('pt-height')?.value) || 0;
      const w = parseFloat(document.getElementById('pt-weight')?.value) || 0;
      const hr = parseFloat(document.getElementById('vital-hr')?.value) || 0;
      const temp = parseFloat(document.getElementById('vital-temp')?.value) || 0;
      const sbp = parseFloat(document.getElementById('vital-sbp')?.value) || 0;
      const badgesContainer = document.getElementById('vitals-alert-badges');

      if (!badgesContainer) return;
      let badgesHTML = '';

      if (h >= 30 && h <= 300 && w > 0) {
        const hm = h / 100;
        const bmi = (w / (hm * hm)).toFixed(1);
        let status = 'Normal';
        let color = 'bg-emerald-100 text-emerald-700 border-emerald-200';
        if (bmi < 18.5) { status = 'Underweight'; color = 'bg-amber-100 text-amber-700 border-amber-200'; }
        else if (bmi >= 25.0 && bmi < 30.0) { status = 'Overweight'; color = 'bg-amber-100 text-amber-700 border-amber-200'; }
        else if (bmi >= 30.0) { status = 'Obese'; color = 'bg-rose-100 text-rose-700 border-rose-200'; }
        badgesHTML += `<span class="px-2 py-0.5 rounded text-[10px] font-bold border ${color}">BMI: ${bmi} (${status})</span>`;
      }

      if (temp >= 38.0) {
        badgesHTML += `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-700 border border-rose-200">Pyrexia</span>`;
      }
      if (hr > 100) {
        badgesHTML += `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-700 border border-rose-200">Tachycardia</span>`;
      } else if (hr > 0 && hr < 60) {
        badgesHTML += `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-sky-100 text-sky-700 border border-sky-200">Bradycardia</span>`;
      }
      if (sbp > 0 && sbp < 90) {
        badgesHTML += `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-700 border border-rose-200">Hypotension</span>`;
      }

      badgesContainer.innerHTML = badgesHTML;
      triggerAsyncAI();
    }

    function handleBodyMapClick(e) {
      const container = document.getElementById('body-map-container');
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const pin = document.createElement('div');
      pin.className = 'pain-pin';
      pin.style.left = `${x}px`;
      pin.style.top = `${y}px`;

      container.appendChild(pin);
      wizardPainMarkers.push({
        x: (x / rect.width).toFixed(3),
        y: (y / rect.height).toFixed(3)
      });
      triggerAsyncAI();
    }

      clearTimeout(aiTimeout);
      const statusBadge = document.getElementById('ai-status');

      if (!statusBadge || !container) return;
      
      statusBadge.className = "px-2 py-0.5 text-[10px] rounded bg-indigo-100 text-indigo-700 font-semibold border border-indigo-200 animate-pulse";

          <div class="h-20 skeleton rounded w-full"></div>

        </div>
      `;

      aiTimeout = setTimeout(async () => {
        const data = readFormData();
        // Simulate network call to Python backend
        await new Promise(r => setTimeout(r, 600));
        
        const analysis = runClinicalCDSInference(data);
        
        statusBadge.className = "px-2 py-0.5 text-[10px] rounded bg-emerald-100 text-emerald-700 font-semibold border border-emerald-200";

            </div>

        container.innerHTML = `

              <p class="text-[10px] text-slate-500 uppercase font-semibold">Triage Acuity (ESI)</p>

            </div>
          </div>

          <!-- Physiological Red Flags -->

            <h5 class="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2 flex items-center gap-1.5">
              <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-rose-600"></i> Identified Red Flags

          <!-- Differential Diagnoses with Probability Ranking -->

            <h5 class="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Likely Differential Diagnoses</h5>

      const patients = getPatients();

        p.name.toLowerCase().includes(q) ||

                    ${rf}
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>

        <div>
          <h5 class="text-slate-500 font-semibold uppercase tracking-wide text-[11px] mb-1 flex items-center justify-between">
            <span>Automated SBAR / SOAP Note</span>
            <button onclick="copyFullSoapNote('${patient.id}')" class="text-sky-600 hover:underline flex items-center gap-1">
              <i data-lucide="copy" class="w-3 h-3"></i> Copy Note
            </button>
          </h5>
          <pre class="bg-slate-50 border border-slate-200 p-4 rounded-xl text-slate-700 text-xs font-mono leading-relaxed whitespace-pre-wrap overflow-x-auto">${patient.analysis.soapNote}</pre>
        </div>
      `;

      document.getElementById('patient-modal').classList.remove('hidden');
      lucide.createIcons();

      // Initialize Chart.js Data Visualisation after the DOM element is created
      setTimeout(() => {
        const canvas = document.getElementById('vitalsChart');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          new Chart(ctx, {
            type: 'line',
            data: {
              labels: ['-3h', '-2h', '-1h', 'Current'],
              datasets: [{
                label: 'Heart Rate',
                // Generate some realistic-looking jitter leading up to the current HR
                data: [
                  patient.vitals.hr > 100 ? patient.vitals.hr - 15 : patient.vitals.hr + 5, 
                  patient.vitals.hr > 100 ? patient.vitals.hr - 5 : patient.vitals.hr - 2, 
                  patient.vitals.hr > 100 ? patient.vitals.hr - 8 : patient.vitals.hr + 3, 
                  patient.vitals.hr
                ],
                borderColor: '#ef4444',
                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                borderWidth: 2,
                tension: 0.4,
                fill: true,
                pointBackgroundColor: '#ef4444',
                pointRadius: 3
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false }, tooltip: { enabled: true } },
              scales: { 
                x: { grid: { display: false }, ticks: { font: { size: 9 } } }, 
                y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 9 } } } 
              }
            }
          });
        }
      }, 150);
    }

    function closeModal() {
      document.getElementById('patient-modal').classList.add('hidden');
    }

    // Initialize application
    window.addEventListener('DOMContentLoaded', () => {
      router('dashboard');
    });
  </script>
</body>
</html>
